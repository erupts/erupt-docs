<svg xmlns="http://www.w3.org/2000/svg" width="900" height="132" viewBox="0 0 900 132" role="img" aria-label="View Erupt Pro pricing and purchase process">
  <!-- card hard shadow -->
  <rect x="10" y="10" width="884" height="116" fill="#2B2827"/>
  <!-- card -->
  <rect x="3.5" y="3.5" width="884" height="116" fill="#FFFAEF" stroke="#2B2827" stroke-width="3"/>

  <!-- icon tile: hard shadow + yellow tile -->
  <rect x="35" y="35" width="64" height="64" fill="#2B2827"/>
  <rect x="29.5" y="29.5" width="64" height="64" fill="#FFD440" stroke="#2B2827" stroke-width="3"/>
  <!-- pixel lightning bolt -->
  <g fill="#2B2827">
    <rect x="59" y="41" width="12" height="6"/>
    <rect x="53" y="47" width="12" height="6"/>
    <rect x="47" y="53" width="12" height="6"/>
    <rect x="47" y="59" width="30" height="6"/>
    <rect x="59" y="65" width="12" height="6"/>
    <rect x="53" y="71" width="12" height="6"/>
    <rect x="47" y="77" width="12" height="6"/>
  </g>

  <!-- title / subtitle -->
  <text x="122" y="60" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#2B2827">Erupt Pro Commercial Modules</text>
  <text x="122" y="92" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6560">Full source · One-time purchase · Lifetime upgrades · Tech support · No commercial limits</text>

  <!-- pixel decorations -->
  <rect x="600" y="28" width="10" height="10" fill="#3BC4E8" stroke="#2B2827" stroke-width="2"/>
  <rect x="620" y="44" width="7" height="7" fill="#FE7DA8" stroke="#2B2827" stroke-width="2"/>
  <rect x="608" y="90" width="8" height="8" fill="#FFD440" stroke="#2B2827" stroke-width="2"/>

  <!-- button: hard shadow + pink button -->
  <g>
    <rect x="668" y="47" width="192" height="46" fill="#2B2827"/>
    <rect x="662.5" y="41.5" width="192" height="46" fill="#FE7DA8" stroke="#2B2827" stroke-width="3"/>
    <text x="686" y="70" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#2B2827">View Pricing</text>
    <path d="M816 56 L824 64.5 L816 73 M804 64.5 H823" stroke="#2B2827" stroke-width="3" fill="none" stroke-linecap="square"/>
  </g>
</svg>
