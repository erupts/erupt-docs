<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <style>.s{font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}</style>
  <rect width="400" height="250" rx="10" fill="#ffffff"/>
  <!-- column headers -->
  <text x="40" y="38" class="s" font-size="12" font-weight="600" fill="#595959">Key</text>
  <text x="200" y="38" class="s" font-size="12" font-weight="600" fill="#595959">Value</text>
  <!-- row 1 -->
  <rect x="40" y="50" width="146" height="32" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.5"/>
  <text x="52" y="71" class="s" font-size="13" fill="#262626">timeout</text>
  <rect x="200" y="50" width="130" height="32" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.5"/>
  <text x="212" y="71" class="s" font-size="13" fill="#262626">30</text>
  <line x1="344" y1="60" x2="356" y2="72" stroke="#8c959f" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="356" y1="60" x2="344" y2="72" stroke="#8c959f" stroke-width="1.6" stroke-linecap="round"/>
  <!-- row 2 -->
  <rect x="40" y="94" width="146" height="32" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.5"/>
  <text x="52" y="115" class="s" font-size="13" fill="#262626">retry</text>
  <rect x="200" y="94" width="130" height="32" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.5"/>
  <text x="212" y="115" class="s" font-size="13" fill="#262626">3</text>
  <line x1="344" y1="104" x2="356" y2="116" stroke="#8c959f" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="356" y1="104" x2="344" y2="116" stroke="#8c959f" stroke-width="1.6" stroke-linecap="round"/>
  <!-- row 3 : editing key with autocomplete -->
  <rect x="40" y="138" width="146" height="32" rx="6" fill="#ffffff" stroke="#4b5cc4" stroke-width="1.6"/>
  <text x="52" y="159" class="s" font-size="13" fill="#262626">reg</text>
  <line x1="78" y1="146" x2="78" y2="162" stroke="#4b5cc4" stroke-width="1.2"/>
  <rect x="200" y="138" width="130" height="32" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.5"/>
  <text x="212" y="159" class="s" font-size="13" fill="#8c959f">Value</text>
  <line x1="344" y1="148" x2="356" y2="160" stroke="#8c959f" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="356" y1="148" x2="344" y2="160" stroke="#8c959f" stroke-width="1.6" stroke-linecap="round"/>
  <!-- autocomplete dropdown -->
  <rect x="40" y="174" width="146" height="30" rx="6" fill="#ffffff" stroke="#d9d9d9" stroke-width="1.2"/>
  <rect x="42" y="176" width="142" height="26" rx="4" fill="#f0f2fb"/>
  <text x="52" y="194" class="s" font-size="12" fill="#4b5cc4">region</text>
  <!-- add footer -->
  <rect x="40" y="212" width="290" height="26" rx="6" fill="#ffffff" stroke="#4b5cc4" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="185" y="229" text-anchor="middle" class="s" font-size="12" fill="#4b5cc4">+ Add</text>
</svg>
