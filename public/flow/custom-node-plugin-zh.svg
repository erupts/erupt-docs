<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="流程节点随意自定义">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2B2827"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="10" y="10" width="884" height="284" fill="#2B2827"/>
  <rect x="3.5" y="3.5" width="884" height="284" fill="#FFFAEF" stroke="#2B2827" stroke-width="3"/>

  <!-- title -->
  <rect x="36" y="30" width="14" height="14" fill="#FFD440" stroke="#2B2827" stroke-width="2"/>
  <text x="62" y="43" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="800" fill="#2B2827">节点即插件 · 任何业务动作都能成为流程节点</text>
  <rect x="836" y="28" width="9" height="9" fill="#3BC4E8" stroke="#2B2827" stroke-width="2"/>
  <rect x="852" y="40" width="7" height="7" fill="#FE7DA8" stroke="#2B2827" stroke-width="2"/>

  <!-- flow row -->
  <rect x="94" y="89" width="76" height="44" fill="#2B2827"/>
  <rect x="90.5" y="85.5" width="76" height="44" fill="#2B2827" stroke="#2B2827" stroke-width="2.5"/>
  <text x="128" y="113" text-anchor="middle" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#FFFAEF">发起</text>

  <line x1="170" y1="107" x2="198" y2="107" stroke="#2B2827" stroke-width="2.5" marker-end="url(#arw)"/>

  <rect x="210" y="89" width="132" height="44" fill="#2B2827"/>
  <rect x="206.5" y="85.5" width="132" height="44" fill="#FFD440" stroke="#2B2827" stroke-width="2.5"/>
  <text x="272" y="113" text-anchor="middle" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#2B2827">人工审批</text>

  <line x1="342" y1="107" x2="370" y2="107" stroke="#2B2827" stroke-width="2.5" marker-end="url(#arw)"/>

  <rect x="382" y="89" width="132" height="44" fill="#2B2827"/>
  <rect x="378.5" y="85.5" width="132" height="44" fill="#3BC4E8" stroke="#2B2827" stroke-width="2.5"/>
  <text x="444" y="113" text-anchor="middle" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#2B2827">延时等待</text>

  <line x1="514" y1="107" x2="542" y2="107" stroke="#2B2827" stroke-width="2.5" marker-end="url(#arw)"/>

  <rect x="554" y="89" width="132" height="44" fill="#2B2827"/>
  <rect x="550.5" y="85.5" width="132" height="44" fill="#FE7DA8" stroke="#2B2827" stroke-width="2.5"/>
  <text x="616" y="113" text-anchor="middle" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#2B2827">邮件通知</text>

  <line x1="686" y1="107" x2="714" y2="107" stroke="#2B2827" stroke-width="2.5" marker-end="url(#arw)"/>

  <rect x="726" y="89" width="76" height="44" fill="#2B2827"/>
  <rect x="722.5" y="85.5" width="76" height="44" fill="#FFFAEF" stroke="#2B2827" stroke-width="2.5"/>
  <text x="760" y="113" text-anchor="middle" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700" fill="#2B2827">结束</text>

  <!-- dashed insert arrow: tray -> flow gap -->
  <line x1="528" y1="182" x2="528" y2="140" stroke="#2B2827" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arw)"/>

  <!-- extensible node tray -->
  <g font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">
    <rect x="65" y="190" width="140" height="44" fill="#FFFFFF" stroke="#2B2827" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="135" y="217" text-anchor="middle" fill="#2B2827">短信发送</text>
    <rect x="220" y="190" width="140" height="44" fill="#FFFFFF" stroke="#2B2827" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="290" y="217" text-anchor="middle" fill="#2B2827">Webhook 调用</text>
    <rect x="375" y="190" width="140" height="44" fill="#FFFFFF" stroke="#2B2827" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="445" y="217" text-anchor="middle" fill="#2B2827">钉钉通知</text>
    <rect x="530" y="190" width="140" height="44" fill="#FFFFFF" stroke="#2B2827" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="600" y="217" text-anchor="middle" fill="#2B2827">数据同步</text>
    <rect x="685" y="190" width="140" height="44" fill="#FFD440" stroke="#2B2827" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="755" y="217" text-anchor="middle" fill="#2B2827">+ 你的节点</text>
  </g>

  <!-- caption -->
  <text x="450" y="268" text-anchor="middle" font-family="'Space Grotesk', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#6B6560">继承 FlexFlowProcess 即注册新节点类型 · 配置表单由 erupt 自动渲染 · 零前端代码</text>
</svg>
